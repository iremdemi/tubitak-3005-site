<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı | DTG Research Portal</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #FAFAFA;
    --bg-alt: #FFFFFF;
    --text-ink: #0F172A;
    --text-body: #475569;
    --accent-navy: #173B7A;
    --accent-teal: #0F8B8D;
    --border-color: #E2E8F0;
    --font-serif: 'Cormorant Garamond', serif;
    --font-sans: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans); background: var(--bg-main); color: var(--text-body);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 32px;
  }
  .wrap { max-width: 480px; }
  .code {
    font-family: var(--font-serif); font-size: 88px; font-weight: 600; color: var(--accent-navy);
    line-height: 1; margin-bottom: 16px;
  }
  h1 { font-family: var(--font-serif); font-size: 28px; font-weight: 600; color: var(--text-ink); margin-bottom: 14px; }
  p { font-size: 14.5px; line-height: 1.7; margin-bottom: 30px; }
  a.home-btn {
    display: inline-flex; align-items: center; gap: 8px; background: var(--accent-navy); color: #FFFFFF;
    text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
    padding: 13px 26px; border-radius: 6px; transition: background .2s ease;
  }
  a.home-btn:hover { background: var(--accent-teal); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Bu bağlantı taşınmış veya kaldırılmış olabilir. Ana sayfadan araştırmayla ilgili tüm bölümlere ulaşabilirsiniz.</p>
    <a href="/tubitak-3005-site/" class="home-btn">Ana Sayfaya Dön</a>
  </div>
</body>
</html>
