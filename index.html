<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İhracat Teşvikleri ve Girişimcilik Araştırma Portalı</title>
<meta name="description" content="TR42 Doğu Marmara Bölgesi'ndeki ihracatçı firmaların katılımıyla gerçekleştirilen kapsamlı dış ticaret girişimciliği analiz portalı.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #FAFAFA;       
    --bg-alt: #FFFFFF;        
    --text-ink: #0F172A;      
    --text-body: #475569;     
    --accent-navy: #173B7A;   /* Kurumsal Lacivert */
    --accent-teal: #0F8B8D;   /* Turkuaz Vurgu */
    --border-color: #E2E8F0;  
    --font-serif: 'Merriweather', serif;
    --font-sans: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body { font-family: var(--font-sans); background-color: var(--bg-main); color: var(--text-body); line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden;}
  a { text-decoration: none; color: inherit; transition: all 0.3s ease; }
  ul { list-style: none; }
  img { max-width: 100%; display: block; }
  
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }

  .hover-lift { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .hover-lift:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08); }

  /* ==========================================================================
     HEADER VE YATAY KOMBİNASYON LOGO
     ========================================================================== */
  header { 
    background-color: var(--bg-alt); border-bottom: 1px solid var(--border-color); 
    position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.02);
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; height: 88px; gap: 24px; max-width: 1360px; margin: 0 auto; padding: 0 32px; }
  
  .brand { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  
  .horizontal-logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .hl-dtg {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 700;
    color: var(--accent-navy);
    letter-spacing: 0.05em;
    line-height: 1;
  }
  .hl-divider {
    width: 1.5px;
    height: 30px;
    background-color: var(--accent-navy);
    opacity: 0.3;
  }
  .hl-stack {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .hl-research, .hl-portal {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-navy);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Menü */
  .nav-menu { display: flex; align-items: center; gap: 28px; margin: 0 auto; }
  .nav-item { position: relative; }
  .nav-menu a { font-size: 12px; font-weight: 600; color: var(--text-ink); padding: 10px 0; display: inline-flex; align-items: center; gap: 3px; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
  .nav-menu a:hover { color: var(--accent-teal); }
  
  .has-dropdown .dropdown-icon { font-size: 8px; transition: transform 0.2s; }
  .dropdown-menu {
    position: absolute; top: 100%; left: 0; background: var(--bg-alt); border: 1px solid var(--border-color);
    box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-radius: 6px; padding: 10px 0; min-width: 180px;
    opacity: 0; visibility: hidden; transform: translateY(8px); transition: all 0.2s ease; z-index: 110;
  }
  .has-dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
  .has-dropdown:hover .dropdown-icon { transform: rotate(180deg); }
  .dropdown-menu a { display: block; padding: 8px 16px; font-size: 11.5px; font-weight: 500; color: var(--text-body); text-transform: none; white-space: nowrap; }
  .dropdown-menu a:hover { background: #F8FAFC; color: var(--accent-navy); }

  .header-right { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
  
  .lang-switch { font-size: 12px; font-weight: 600; color: var(--text-body); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .lang-switch span { transition: color 0.2s; padding: 2px 4px; }
  .lang-switch span:hover { color: var(--accent-teal); }
  .lang-switch span.active { color: var(--accent-navy); font-weight: 700; background: #F1F5F9; border-radius: 4px; }
  .lang-switch .sep { color: #CBD5E1; font-weight: 300; }
  
  .btn-outline-header {
    border: 1px solid var(--accent-navy); color: var(--accent-navy);
    padding: 8px 16px; font-size: 11.5px; font-weight: 700; border-radius: 4px;
    transition: all 0.2s; white-space: nowrap;
  }
  .btn-outline-header:hover { background: var(--accent-navy); color: var(--bg-alt); }

  /* ==========================================================================
     HERO SECTION
     ========================================================================== */
  .hero-corporate {
    position: relative;
    width: 100%;
    min-height: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #FFFFFF;
    padding: 90px 24px;
    overflow: hidden;
  }

  .hero-slides {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .hero-slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transform: scale(1.05);
    transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1), transform 6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .hero-slide.active {
    opacity: 1;
    transform: scale(1);
  }
  .hero-corporate::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(23, 59, 122, 0.82), rgba(15, 139, 141, 0.72));
    z-index: 1;
    pointer-events: none;
  }
  
  .hero-corporate-inner {
    position: relative;
    z-index: 2;
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hero-corporate h1 {
    font-family: var(--font-serif);
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 900;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    line-height: 1.25;
    color: #FFFFFF;
  }

  .hero-corporate p {
    font-size: 15.5px;
    max-width: 680px;
    font-weight: 400;
    line-height: 1.7;
    color: #E2E8F0;
    margin-bottom: 36px;
  }

  .btn-hero-view {
    border: 1px solid rgba(255, 255, 255, 0.7);
    color: #FFFFFF;
    background: rgba(255, 255, 255, 0.05);
    padding: 12px 32px;
    border-radius: 30px;
    font-size: 12.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    backdrop-filter: blur(4px);
    transition: all 0.3s ease;
  }
  .btn-hero-view:hover {
    background: #FFFFFF;
    color: var(--text-ink);
    border-color: #FFFFFF;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
  }

  /* ==========================================================================
     DEV MASKELENMİŞ YAZI BÖLÜMÜ
     ========================================================================== */
  .giant-text-section {
    position: relative;
    width: 100%;
    padding: 85px 0 65px 0;
    background-color: var(--bg-alt);
    text-align: center;
    overflow: hidden;
    border-bottom: 1px solid var(--border-color);
  }

  .giant-text-subtitle {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-body);
    margin-bottom: 24px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  .giant-masked-text {
    font-family: 'Inter', sans-serif;
    font-size: 14.8vw;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 0.8;
    letter-spacing: -0.05em;
    background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: block;
    width: 100%;
    margin: 0;
    padding: 0;
    text-align: center;
    user-select: none;
  }

  /* ==========================================================================
     HABER / ANALİZ SLIDER
     ========================================================================== */
  .news-slider-section { padding: 64px 0 96px; background: var(--bg-main); }
  .news-slider {
    display: flex; gap: 24px; overflow-x: auto; padding-bottom: 32px; padding-top: 10px;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; scrollbar-color: #CBD5E1 transparent; cursor: grab;
  }
  .news-slider:active { cursor: grabbing; }
  .news-slider::-webkit-scrollbar { height: 8px; }
  .news-slider::-webkit-scrollbar-thumb { background-color: #CBD5E1; border-radius: 10px; }
